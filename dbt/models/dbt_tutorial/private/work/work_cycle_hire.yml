version: 2
models:
  - name: work_cycle_hire
    description: ""
    columns:
      - name: rental_id
        description: ""
        tests:
          - unique
          - not_null
      - name: duration
        description: ""
      - name: bike_id
        description: ""
        test:
          - not_null
      - name: end_date
        description: ""
      - name: end_station_id
        description: ""
        tests:
          # Tests if each end_station_id value in the model `work_cycle_hire`
          # exists as a station_id in the model `work_cycle_stations`
          - relationships:
              to: ref('work_cycle_stations')
              field: station_id
          # Tests if each end_station_id value in the model `work_cycle_hire`
          # exists as a station_id in the model `work_cycle_stations`
          - relationships:
              to: source('london_bicycles', 'work_cycle_stations')
              # name in the source is id (in the model, it is renamed to station_id)
              field: id
      - name: end_station_name
        description: ""
      - name: start_date
        description: ""
      - name: start_station_id
        description: ""
      - name: start_station_name
        description: ""
      - name: end_station_logical_terminal
        description: ""
      - name: start_station_logical_terminal
        description: ""
      - name: end_station_priority_id
        description: ""
